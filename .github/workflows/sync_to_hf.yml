name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ secrets.HF_SPACE_REPO }} # Ex: seu-usuario/nfl-odds-api
        if: env.HF_TOKEN != '' && env.HF_SPACE_REPO != ''
        run: |
          git push https://user:$HF_TOKEN@huggingface.co/spaces/$HF_SPACE_REPO main:main --force
