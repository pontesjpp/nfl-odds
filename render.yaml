services:
  - type: web
    name: nfl-odds-api
    runtime: python
    buildCommand: "pip install uv && uv sync --frozen --no-dev"
    startCommand: "uv run uvicorn nfl_odds.dashboard.api:app --host 0.0.0.0 --port $PORT --limit-concurrency 50 --timeout-keep-alive 5"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: READ_ONLY_MODE
        value: "true"
      - key: ADMIN_PASSWORD
        sync: false
      - key: MFA_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
