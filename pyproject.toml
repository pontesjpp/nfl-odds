[project]
name = "nfl-odds"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "fastapi>=0.141.1",
    "google-genai>=2.22.0",
    "httpx>=0.28.1",
    "lightgbm>=4.7.0",
    "mlflow>=3.16.0",
    "nflreadpy>=0.1.5",
    "pandas>=3.0.5",
    "playwright>=1.62.0",
    "playwright-stealth>=2.0.0",
    "plotly>=7.0.0",
    "polars>=1.44.1",
    "psycopg2-binary>=2.9.12",
    "pyotp>=2.10.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "sqlalchemy>=2.0.52",
    "streamlit>=1.63.0",
    "uvicorn>=0.52.4",
    "xgboost>=3.4.1",
]

[project.scripts]
nfl-odds = "nfl_odds.pipeline:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    "node_modules",
    "archive",
    "frontend",
    "frontend-vite-backup",
    "data",
    "scratch",
    "scripts",
    ".venv",
]
pythonpath = ["src"]

