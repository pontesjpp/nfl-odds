<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,600..900&amp;family=Plus+Jakarta+Sans:wght@500;700&amp;display=swap');
      .lockup-title {
        font-family: 'Bodoni Moda', 'Didot', serif;
        font-weight: 700;
        font-size: 54px;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        fill: #F4E8D1;
      }
      .lockup-sub {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-weight: 600;
        font-size: 16px;
        letter-spacing: 0.52em;
        text-transform: uppercase;
        fill: #C5A880;
      }
    </style>
  </defs>

  <rect width="1200" height="220" fill="#050505"/>

  <!-- Standalone Monogram Mark on the Left (scale: 130px) -->
  <g transform="translate(100, 45)">
    <rect width="130" height="130" rx="28" fill="#0C0A08" stroke="#2B261D" stroke-width="1.5"/>
    <circle cx="65" cy="65" r="54" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="2 6"/>
    
    <!-- Mini B Monogram in Lockup -->
    <g transform="translate(38, 30) scale(0.28)">
      <path d="M 0 0 L 46 0 L 46 260 L 0 260 Z" fill="#F4E8D1"/>
      <path d="M 46 0 L 126 0 C 172 0 202 24 202 65 C 202 104 170 125 124 128 L 46 128 Z" fill="#F4E8D1"/>
      <path d="M 86 36 L 122 36 C 146 36 160 48 160 65 C 160 82 146 94 122 94 L 86 94 Z" fill="#0C0A08"/>
      <path d="M 46 132 L 136 132 C 188 132 220 156 220 196 C 220 236 186 260 134 260 L 46 260 Z" fill="#F4E8D1"/>
      <path d="M 86 166 L 132 166 C 158 166 178 178 178 196 C 178 214 158 226 132 226 L 86 226 Z" fill="#0C0A08"/>
      <line x1="38" y1="130" x2="228" y2="130" stroke="#0C0A08" stroke-width="6"/>
      <circle cx="132" cy="130" r="4.5" fill="#D4AF37"/>
    </g>
  </g>

  <!-- Vertical Divider Hairline -->
  <line x1="280" y1="65" x2="280" y2="155" stroke="#2B261D" stroke-width="1"/>

  <!-- Typography Right Column -->
  <g transform="translate(330, 0)">
    <text x="0" y="106" class="lockup-title">BISKATE</text>
    <line x1="2" y1="124" x2="520" y2="124" stroke="#2B261D" stroke-width="1"/>
    <circle cx="260" cy="124" r="2.5" fill="#D4AF37"/>
    <text x="4" y="156" class="lockup-sub">ANALYTICS</text>
  </g>
</svg>